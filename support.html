<h1>余温技术支持</h1><p>余温是一款帮助你记录剩菜时间的 iPhone 应用。它提供时间提醒，但不能判断食物是否安全或变质。</p>
<h2>联系我们</h2><p>使用中遇到问题或有建议，请发送邮件至 <a href="mailto:2649643013@qq.com">2649643013@qq.com</a>。请尽量说明设备型号、系统版本、问题出现的步骤；请勿发送不必要的个人信息。</p>
<h2>常见问题</h2><p><strong>无法拍照？</strong> 请检查 iPhone 的设置中是否允许余温使用相机，或者使用照片选择器。</p><p><strong>没有提醒？</strong> 请检查系统设置中余温的通知权限。</p><p><a href="privacy.html">隐私政策</a></p></main></body></html>
